<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo Calendar</title>
<style>
:root{--bg:#fff;--ink:#1b1d21;--sub:#8a8f98;--line:#eceef1;--soft:#f6f7f9;--accent:#3b6cf6}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:32px;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:22px;font-weight:700;margin-bottom:20px}
.month-box{border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:24px}
.month-box h2{font-size:14px;color:var(--sub);font-weight:600;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit}
input[type=text]{flex:1;min-width:160px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 14px;outline:none}
input[type=text]:focus{border-color:var(--accent);background:#fff}
select{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:10px 12px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600}
.btn:hover{opacity:.85}
.main{display:grid;grid-template-columns:400px 1fr;gap:24px}
@media(max-width:820px){.main{grid-template-columns:1fr}body{padding:16px}}
.card{border:1px solid var(--line);border-radius:16px;padding:20px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head b{font-size:16px}
.nav{border:0;background:var(--soft);width:30px;height:30px;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--sub);padding:6px 0}
.day{aspect-ratio:1;border-radius:12px;border:0;background:none;cursor:pointer;font-size:14px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink)}
.day:hover{background:var(--soft)}
.day.today{font-weight:700;color:var(--accent)}
.day.sel{background:var(--ink);color:#fff}
.day.empty{visibility:hidden}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.side-title{font-size:18px;font-weight:700;margin-bottom:4px}
.side-sub{color:var(--sub);font-size:13px;margin-bottom:16px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 6px}
.chip{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.newcat{display:flex;gap:6px;align-items:center;margin-bottom:18px}
.newcat input[type=color]{width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer}
.newcat input[type=text]{padding:7px 12px;font-size:13px}
.newcat .btn{padding:7px 12px;font-size:13px;background:var(--soft);color:var(--ink)}
ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
li{display:flex;align-items:center;gap:12px;border-radius:12px;padding:12px 14px;border-left:4px solid}
li .t{flex:1}
li.done .t{text-decoration:line-through;opacity:.45}
li .tag{font-size:11px;font-weight:700}
li input[type=checkbox]{width:18px;height:18px;cursor:pointer}
li .x{border:0;background:none;color:var(--sub);cursor:pointer;font-size:16px}
.empty-msg{color:var(--sub);text-align:center;padding:30px 0;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Todo Calendar</h1>

  <div class="month-box">
    <h2 id="mTitle">이번 달 할 일</h2>
    <div class="row">
      <input type="text" id="mText" placeholder="이번 달에 꼭 하고 싶은 일을 적어보세요">
      <select id="mCat"></select>
      <button class="btn" id="mAdd">추가</button>
    </div>
    <ul id="mList" style="margin-top:14px"></ul>
  </div>

  <div class="main">
    <div class="card">
      <div class="cal-head">
        <button class="nav" id="prev">‹</button><b id="ym"></b><button class="nav" id="next">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="days"></div>
    </div>

    <div class="card">
      <div class="side-title" id="dTitle"></div>
      <div class="side-sub" id="dSub"></div>
      <div class="row">
        <input type="text" id="text" placeholder="할 일을 입력하세요">
        <select id="cat"></select>
        <button class="btn" id="add">추가</button>
      </div>
      <div class="cats" id="cats"></div>
      <div class="newcat">
        <input type="color" id="ncColor" value="#8b5cf6">
        <input type="text" id="ncName" placeholder="새 카테고리">
        <button class="btn" id="ncAdd">+ 만들기</button>
      </div>
      <ul id="list"></ul>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
let cats=[{n:"업무",c:"#3b6cf6"},{n:"개인",c:"#f0567a"},{n:"공부",c:"#22a06b"},{n:"운동",c:"#f59e0b"}];
let todos={}; // key: YYYY-MM-DD or YYYY-MM (monthly)
const now=new Date();let view=new Date(now.getFullYear(),now.getMonth(),1);let sel=new Date(now);
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const mkey=d=>key(d).slice(0,7);
const col=n=>(cats.find(x=>x.n===n)||{c:"#999"}).c;
const tint=c=>c+"14";

function add(k,text,cat){if(!text.trim())return;(todos[k]=todos[k]||[]).push({t:text.trim(),cat,done:false});render()}
function items(k,el){
  const l=todos[k]||[];
  el.innerHTML=l.length?"":`<div class="empty-msg">아직 할 일이 없어요</div>`;
  l.forEach((it,i)=>{
    const c=col(it.cat),li=document.createElement("li");
    li.style.borderColor=c;li.style.background=tint(c);if(it.done)li.className="done";
    li.innerHTML=`<input type="checkbox" ${it.done?"checked":""}><span class="t">${it.t.replace(/</g,"&lt;")}</span><span class="tag" style="color:${c}">${it.cat}</span><button class="x">×</button>`;
    li.querySelector("input").onchange=()=>{it.done=!it.done;render()};
    li.querySelector(".x").onclick=()=>{l.splice(i,1);render()};
    el.appendChild(li);
  });
}
function render(){
  const opts=cats.map(c=>`<option>${c.n}</option>`).join("");
  [$("cat"),$("mCat")].forEach(s=>{const v=s.value;s.innerHTML=opts;if(v)s.value=v});
  $("cats").innerHTML=cats.map(c=>`<span class="chip" style="background:${tint(c.c)};color:${c.c}"><i style="width:8px;height:8px;border-radius:50%;background:${c.c}"></i>${c.n}</span>`).join("");
  $("ym").textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
  $("mTitle").textContent=`${view.getMonth()+1}월 할 일`;
  $("dows").innerHTML=["일","월","화","수","목","금","토"].map(d=>`<div class="dow">${d}</div>`).join("");
  const first=view.getDay(),len=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";for(let i=0;i<first;i++)h+=`<div class="day empty"></div>`;
  for(let d=1;d<=len;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d),k=key(dt);
    const dots=[...new Set((todos[k]||[]).map(x=>x.cat))].slice(0,4).map(n=>`<i style="background:${col(n)}"></i>`).join("");
    h+=`<button class="day ${k===key(now)?"today":""} ${k===key(sel)?"sel":""}" data-k="${d}">${d}<span class="dots">${dots}</span></button>`;
  }
  $("days").innerHTML=h;
  $("days").querySelectorAll(".day:not(.empty)").forEach(b=>b.onclick=()=>{sel=new Date(view.getFullYear(),view.getMonth(),+b.dataset.k);render()});
  const w=["일","월","화","수","목","금","토"][sel.getDay()];
  $("dTitle").textContent=`${sel.getMonth()+1}월 ${sel.getDate()}일 ${w}요일`;
  const n=(todos[key(sel)]||[]);$("dSub").textContent=`${n.filter(x=>x.done).length}/${n.length} 완료`;
  items(key(sel),$("list"));items(mkey(view),$("mList"));
}
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
$("add").onclick=()=>{add(key(sel),$("text").value,$("cat").value);$("text").value=""};
$("mAdd").onclick=()=>{add(mkey(view),$("mText").value,$("mCat").value);$("mText").value=""};
$("text").onkeydown=e=>e.key==="Enter"&&$("add").click();
$("mText").onkeydown=e=>e.key==="Enter"&&$("mAdd").click();
$("ncAdd").onclick=()=>{const n=$("ncName").value.trim();if(n&&!cats.some(c=>c.n===n)){cats.push({n,c:$("ncColor").value});$("ncName").value="";render()}};
add(key(sel),"주간 회의 준비","업무");add(key(sel),"헬스장 가기","운동");add(mkey(view),"영어 책 1권 읽기","공부");
</script>
</body>
</html>
