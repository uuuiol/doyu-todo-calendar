<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DoYu Todo Calendar</title>
<style>
:root{--bg:#fff;--ink:#1b1d21;--sub:#8a8f98;--line:#eceef1;--line2:#d9d9d9;--soft:#f6f7f9;--form:#fafbfc}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Inter","Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;padding:40px 60px;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0}
h1{font-size:24px;font-weight:700;margin-bottom:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px}
.label{font-size:12px;font-weight:600;color:var(--sub)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1;min-width:0}

/* inputs & buttons */
.inp{width:100%;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14px;outline:none}
.inp::placeholder{color:var(--sub)}
.inp:focus{border-color:var(--ink);background:#fff}
.inp.white{background:#fff}
.sel{position:relative;display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:0 12px 0 14px;height:43px}
.sel.white{background:#fff}
.sel i{width:8px;height:8px;border-radius:50%;flex:none}
.sel select{appearance:none;border:0;background:none;outline:none;font-size:14px;padding-right:16px;cursor:pointer;height:100%}
.sel::after{content:"⌄";position:absolute;right:10px;top:9px;font-size:13px;color:var(--sub);pointer-events:none}
.btn{background:var(--soft);color:var(--ink);border-radius:10px;padding:12px 20px;font-size:14px;font-weight:600;white-space:nowrap}
.btn.dark{background:var(--ink);color:#fff}
.btn:hover{opacity:.85}
.btn.sm{padding:8px 12px;font-size:13px}

/* monthly */
.month h2{font-size:14px;font-weight:600;color:var(--sub);margin-bottom:14px}
.month .list{margin-top:14px}

/* main layout */
.main{display:grid;grid-template-columns:480px 1fr;gap:24px;margin-top:24px;align-items:start}
.left{display:flex;flex-direction:column;gap:16px}
.panel{border-color:var(--line2);padding:24px;display:flex;flex-direction:column;gap:16px}

/* calendar */
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-head b{font-size:16px}
.nav{background:var(--soft);width:30px;height:30px;border-radius:8px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{font-size:11px;color:var(--sub);padding:6px 0}
.day{height:54px;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;color:var(--ink)}
.day:hover{background:var(--soft)}
.day.today{color:#3C5BC4;font-weight:700}
.day.sel{background:var(--ink);color:#fff;font-weight:700}
.day.empty{visibility:hidden}
.dots{display:flex;gap:2px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%}
.mark{font-size:9px;font-weight:700;padding:2px 5px;border-radius:5px;line-height:1.2;max-width:100%;white-space:nowrap}

/* deadline list */
.dl-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.dl-head b{font-size:15px}.dl-head span{font-size:12px;color:var(--sub)}
.dl-item{display:flex;align-items:center;gap:12px;padding:6px 0}
.dbadge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:8px;min-width:44px;text-align:center}
.dl-item .t{flex:1}.dl-item .t b{display:block;font-size:14px}.dl-item .t small{font-size:12px;color:var(--sub)}
.dl-item .d{width:8px;height:8px;border-radius:50%}
.empty-msg{color:var(--sub);font-size:13px;text-align:center;padding:14px 0}

/* panel header */
.ph{display:flex;justify-content:space-between;align-items:center}
.ph h2{font-size:20px;font-weight:700}
.ph p{font-size:13px;color:var(--sub);margin-top:4px}

/* add form */
.form{background:var(--form);border:1px solid var(--line);border-radius:14px;padding:18px;display:none;flex-direction:column;gap:14px}
.form.open{display:flex}
.form .inp.main-in{background:#fff;border:1.5px solid var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.chip{display:flex;align-items:center;border-radius:999px;font-size:13px;font-weight:600;background:#fff;border:1.5px solid var(--line2);transition:.15s}
.chip .cn{display:flex;align-items:center;gap:6px;background:none;color:inherit;font-weight:600;font-size:13px;padding:6px 12px}
.chip .cn i{width:8px;height:8px;border-radius:50%}
.chip .cx{background:none;color:inherit;opacity:.35;font-size:15px;line-height:1;padding:6px 10px 6px 4px}
.chip .cx:hover{opacity:1}
.chip.on{border-color:currentColor}
.cat-head{display:flex;justify-content:space-between;align-items:center;min-height:26px}
.edit-btn{background:none;color:var(--sub);font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px}
.edit-btn:hover{background:var(--soft);color:var(--ink)}
.edit-btn.on{background:var(--ink);color:#fff}
.chip.add{background:#fff;border:1.5px dashed var(--line2);color:var(--sub);padding:6px 12px;font-size:13px;font-weight:600}
.chip.add:hover{color:var(--ink);border-color:var(--ink)}
.chip.editing{padding-left:12px;border-style:dashed;border-color:currentColor}
.chip.editing>i{width:8px;height:8px;border-radius:50%;margin-right:6px;flex:none}
.chip .cname{border:0;background:transparent;color:inherit;font:inherit;font-weight:600;font-size:13px;outline:none;padding:6px 0;min-width:0}
.newcat[hidden]{display:none}
#toast.act{pointer-events:auto}
#toast button{background:none;color:#fff;font-size:14px;font-weight:700;text-decoration:underline;margin-left:14px}
.item{flex-wrap:wrap}
.rp-menu{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;padding:4px 0 2px 30px}
.rp-menu button{background:var(--soft);font-size:12px;font-weight:600;padding:7px 12px;border-radius:8px}
.rp-menu button:hover{background:var(--line)}
.rp-menu .danger{color:#C24468;background:#FFE4EB}
.rp-opts{display:none;flex-direction:column;gap:12px;margin-top:10px}
.rp-opts.open{display:flex}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;align-self:flex-start}
.seg button{background:none;padding:7px 16px;border-radius:8px;font-size:13px;font-weight:600;color:var(--sub)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.dowpick{display:none;gap:6px}
.dowpick.open{display:flex}
.dowpick button{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:13px;font-weight:600}
.dowpick button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rp-hint{font-size:12px;color:var(--sub)}
.rp-until small{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.due.rp{color:var(--ink);background:var(--soft);padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600}
.newcat{display:flex;align-items:center;gap:10px;max-width:340px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 5px 5px 8px;transition:.15s}
.newcat:focus-within{border-color:var(--ink)}
.swatch{position:relative;width:26px;height:26px;border-radius:50%;background:#1b1d21;flex:none;cursor:pointer;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7),0 0 0 1px var(--line)}
.swatch input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.newcat>input[type=text]{flex:1;min-width:0;border:0;outline:none;background:none;font-size:13px;padding:6px 0}
.newcat>input::placeholder{color:var(--sub)}
.newcat button{background:var(--ink);color:#fff;font-size:13px;font-weight:600;border-radius:999px;padding:7px 16px;transition:.15s}
.newcat button:disabled{background:var(--soft);color:var(--sub);cursor:default}
.hr{height:1px;background:var(--line)}
.toggle{display:flex;gap:8px;margin-top:8px}
.tg{padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line)}
.tg.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.dl-inputs{display:none;gap:12px;margin-top:10px}
.dl-inputs.open{display:flex}
.dl-inputs>div{flex:1}
.dl-inputs small{display:block;font-size:12px;color:var(--sub);margin-bottom:6px}
.lbl-wrap{position:relative}
.lbl-wrap em{position:absolute;right:12px;top:13px;font-size:12px;color:var(--sub);font-style:normal}
.lbl-wrap .inp{border:1.5px solid var(--ink);background:#fff}
.actions{display:flex;justify-content:flex-end;gap:8px}

/* todo entries: label above, white item */
.list{display:flex;flex-direction:column;gap:14px}
.entry{display:flex;flex-direction:column;gap:1px}
.entry .cat{font-size:14px;font-weight:700;margin-bottom:5px}
.item{display:flex;align-items:center;gap:12px;padding:7px 14px;border-radius:12px;background:#fff}
.item:hover{background:var(--form)}
.cb{width:18px;height:18px;border-radius:5px;border:1.5px solid;background:#fff;flex:none;padding:0;position:relative}
.item.done .cb::after{content:"✓";position:absolute;inset:0;font-size:12px;line-height:15px;color:#fff;text-align:center;font-weight:700}
.item .tx{flex:1;font-size:14px}
.item.done .tx{text-decoration:line-through;opacity:.45}
.item .due{font-size:12px;color:var(--sub)}
.item .x{background:none;font-size:22px;color:var(--sub);line-height:1;padding:0 4px}
.item .x:hover{color:var(--ink)}
.item .ed{background:none;color:var(--sub);font-size:15px;line-height:1;padding:4px 6px;border-radius:6px}
.item .ed:hover{color:var(--ink);background:var(--soft)}
.edit-banner{font-size:13px;font-weight:600;background:#fff;border:1.5px dashed var(--ink);border-radius:10px;padding:9px 12px}
.edit-banner[hidden]{display:none}
#mCancel[hidden]{display:none}

@media(max-width:900px){body{padding:20px 16px}.main{grid-template-columns:1fr}.dl-inputs{flex-direction:column}}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:10}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<h1>DoYu Todo Calendar</h1>

<section class="card month">
  <h2 id="mTitle"></h2>
  <div class="row">
    <input class="inp grow" id="mText" type="text" placeholder="이번 달에 꼭 하고 싶은 일을 적어보세요">
    <div class="sel"><i id="mDot"></i><select id="mCat"></select></div>
    <button class="btn" id="mCancel" hidden>취소</button>
    <button class="btn dark" id="mAdd">추가</button>
  </div>
  <div class="list" id="mList"></div>
</section>

<div class="main">
  <div class="left">
    <section class="card">
      <div class="cal-head">
        <button class="nav" id="prev">‹</button><b id="ym"></b><button class="nav" id="next">›</button>
      </div>
      <div class="grid" id="dows"></div>
      <div class="grid" id="days" style="margin-top:4px"></div>
    </section>
    <section class="card">
      <div class="dl-head"><b>다가오는 마감</b><span id="dlCount"></span></div>
      <div id="dlList"></div>
    </section>
  </div>

  <section class="card panel">
    <div class="ph">
      <div><h2 id="dTitle"></h2><p id="dSub"></p></div>
      <button class="btn dark" id="toggleForm">+ 할 일 추가</button>
    </div>

    <div class="form" id="form">
      <div class="edit-banner" id="editBanner" hidden></div>
      <input class="inp main-in" id="text" type="text" placeholder="할 일을 입력하세요">
      <div>
        <div class="cat-head"><span class="label">카테고리</span><button class="edit-btn" id="catEdit">✎ 수정</button></div>
        <div class="chips" id="chips"></div>
        <div class="newcat" id="newcat" hidden>
          <label class="swatch" id="ncSwatch" title="색상 선택"><input type="color" id="ncColor" value="#1b1d21"></label>
          <input id="ncName" type="text" placeholder="새 카테고리 이름" maxlength="12" autocomplete="off">
          <button id="ncAdd" disabled>추가</button>
        </div>
      </div>
      <div class="hr"></div>
      <div>
        <div class="label">마감일</div>
        <div class="toggle">
          <button class="tg on" id="tgNone">마감일 없음</button>
          <button class="tg" id="tgSet">마감일 설정</button>
        </div>
        <div class="dl-inputs" id="dlInputs">
          <div><small>마감 날짜</small><input class="inp white" type="date" id="dDate"></div>
          <div><small>캘린더 표시 문구 (최대 4자)</small>
            <div class="lbl-wrap"><input class="inp" id="dLabel" type="text" maxlength="4" placeholder="예: 제출"><em id="dCnt">0/4</em></div>
          </div>
        </div>
      </div>
      <div class="hr"></div>
      <div>
        <div class="label">반복</div>
        <div class="toggle">
          <button class="tg on" id="rpNone">반복 없음</button>
          <button class="tg" id="rpSet">반복 설정</button>
        </div>
        <div class="rp-opts" id="rpOpts">
          <div class="seg" id="rpType">
            <button data-t="daily" class="on">매일</button>
            <button data-t="weekly">매주</button>
            <button data-t="monthly">매월</button>
          </div>
          <div class="dowpick" id="rpDays"></div>
          <div class="rp-hint" id="rpHint"></div>
          <div class="rp-until"><small>종료일 (선택 · 비우면 계속 반복)</small><input class="inp white" type="date" id="rpUntil"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn" id="cancel">취소</button>
        <button class="btn dark" id="add" style="padding:12px 26px">추가하기</button>
      </div>
    </div>

    <div class="list" id="list"></div>
  </section>
</div>

<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=k=>{const[a,b,c]=k.split("-").map(Number);return new Date(a,b-1,c)};
const DOW=["일","월","화","수","목","금","토"];
const today=new Date();today.setHours(0,0,0,0);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};

// colors
const mix=(hex,to,t)=>{const c=[1,3,5].map(i=>parseInt(hex.slice(i,i+2),16));return "#"+c.map(v=>Math.round(v*(1-t)+to*t).toString(16).padStart(2,"0")).join("")};
const mkCat=(n,dot)=>({n,dot,bg:mix(dot,255,.78),tx:mix(dot,0,.4)});

// ---- API ----
async function api(method,url,body){
  const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:undefined,body:body?JSON.stringify(body):undefined});
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const e=new Error(d.error||"요청에 실패했어요");e.status=r.status;e.data=d;throw e}
  return d;
}
let toastT;
function toast(msg,action){
  const t=$("toast");t.textContent=msg;
  if(action){const b=document.createElement("button");b.textContent=action.label;b.onclick=()=>{t.classList.remove("show");action.fn()};t.append(b)}
  t.classList.toggle("act",!!action);t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),action?6000:2600);
}
async function reload(){S=await api("GET","/api/state");if(!S.cats.some(c=>c.n===fCat))fCat=S.cats[0]&&S.cats[0].n;render()}
async function run(fn){try{await fn()}catch(e){toast(e.message);try{await reload()}catch(_){}}}

// state
let S={cats:[],todos:[],monthly:{}};
let view=new Date(today.getFullYear(),today.getMonth(),1),sel=new Date(today);
let fCat="",fDl=false,catEdit=false,newOpen=false,fRp=false,rpType="daily",rpDays=new Set(),editId=null,mEditId=null;
const cat=n=>S.cats.find(c=>c.n===n)||{dot:"#bbb",bg:"#eee",tx:"#666"};

// ---- recurrence: a todo repeats from its start date (t.date) until r.until (optional)
function occurs(t,k){
  if(!t.repeat)return t.date===k;
  if(k<t.date||(t.skipDates||[]).includes(k))return false;
  const r=t.repeat;if(r.until&&k>r.until)return false;
  const d=parse(k);
  if(r.type==="daily")return true;
  if(r.type==="weekly")return (r.days||[]).includes(d.getDay());
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return d.getDate()===Math.min(parse(t.date).getDate(),last); // 31st -> last day of shorter months
}
const isDone=(t,k)=>t.repeat?(t.doneDates||[]).includes(k):t.done;
function repeatLabel(t){
  const r=t.repeat;if(!r)return "";
  let s=r.type==="daily"?"매일":r.type==="weekly"?"매주 "+[...(r.days||[])].sort().map(d=>DOW[d]).join("·"):"매월 "+parse(t.date).getDate()+"일";
  if(r.until){const u=parse(r.until);s+=" ~ "+(u.getMonth()+1)+"/"+u.getDate()}
  return s;
}

// entries
// one row (checkbox, text, extras, delete)
function itemHTML(t,extra="",done=t.done){
  const c=cat(t.cat);
  return `<div class="item ${done?"done":""}" data-id="${t.id}">
    <button class="cb" style="border-color:${c.dot};${done?`background:${c.dot}`:""}"></button>
    <span class="tx">${esc(t.text)}</span>${extra}<button class="ed" title="수정" aria-label="수정">✎</button><button class="x">×</button></div>`;
}
// rows grouped under ONE category label each, in the order of the category list
function groupHTML(rows){
  const by=new Map(S.cats.map(c=>[c.n,[]]));
  rows.forEach(r=>{if(!by.has(r.t.cat))by.set(r.t.cat,[]);by.get(r.t.cat).push(r)});
  return [...by].filter(([,a])=>a.length).map(([n,a])=>
    `<div class="entry"><span class="cat" style="color:${cat(n).tx}">${esc(n)}</span>${a.map(r=>itemHTML(r.t,r.extra,r.done)).join("")}</div>`).join("");
}
function bindList(el,kind,arr,after){
  const dk=key(sel);
  el.querySelectorAll(".item").forEach(it=>{
    const t=arr().find(x=>String(x.id)===it.dataset.id);
    it.querySelector(".cb").onclick=()=>run(async()=>{
      if(kind==="todos"&&t.repeat){
        const set=new Set(t.doneDates||[]),nd=!set.has(dk);nd?set.add(dk):set.delete(dk);t.doneDates=[...set];
        after();await api("PATCH",`/api/todos/${t.id}`,{done:nd,date:dk});
      }else{t.done=!t.done;after();await api("PATCH",`/api/${kind}/${t.id}`,{done:t.done})}
    });
    it.querySelector(".ed").onclick=()=>kind==="todos"?startEdit(t):startMonthlyEdit(t);
    it.querySelector(".x").onclick=()=>{
      if(kind==="todos"&&t.repeat){
        const open=it.querySelector(".rp-menu");
        if(open){open.remove();return}
        const m=document.createElement("div");m.className="rp-menu";
        m.innerHTML='<button data-a="skip">이 날만 건너뛰기</button><button data-a="all" class="danger">반복 전체 삭제</button><button data-a="cancel">취소</button>';
        it.append(m);
        m.querySelector('[data-a="cancel"]').onclick=()=>m.remove();
        m.querySelector('[data-a="skip"]').onclick=()=>run(async()=>{
          t.skipDates=[...(t.skipDates||[]),dk];after();
          toast("이 날만 건너뛰었어요",{label:"되돌리기",fn:()=>run(async()=>{
            t.skipDates=(t.skipDates||[]).filter(d=>d!==dk);after();
            await api("PATCH",`/api/todos/${t.id}`,{skip:false,date:dk});
          })});
          await api("PATCH",`/api/todos/${t.id}`,{skip:true,date:dk});
        });
        m.querySelector('[data-a="all"]').onclick=()=>run(async()=>{const a=arr();a.splice(a.indexOf(t),1);after();await api("DELETE",`/api/todos/${t.id}`)});
        return;
      }
      run(async()=>{const a=arr();a.splice(a.indexOf(t),1);after();await api("DELETE",`/api/${kind}/${t.id}`)});
    };
  });
}

function render(){
  // category selects
  const opts=S.cats.map(c=>`<option>${esc(c.n)}</option>`).join("");
  const mv=$("mCat").value;$("mCat").innerHTML=opts;if(S.cats.some(c=>c.n===mv))$("mCat").value=mv;
  $("mDot").style.background=cat($("mCat").value).dot;
  $("chips").innerHTML=S.cats.map(c=>catEdit
    ?`<div class="chip editing" style="color:${c.tx}"><i style="background:${c.dot}"></i><input class="cname" data-n="${esc(c.n)}" value="${esc(c.n)}" maxlength="12" size="${Math.max(3,c.n.length+1)}" aria-label="카테고리 이름"><button class="cx" data-n="${esc(c.n)}" title="카테고리 삭제" aria-label="${esc(c.n)} 삭제">×</button></div>`
    :`<div class="chip ${c.n===fCat?"on":""}" style="color:${c.tx}"><button class="cn" data-n="${esc(c.n)}"><i style="background:${c.dot}"></i>${esc(c.n)}</button></div>`).join("")
    +(catEdit?"":`<button class="chip add" id="addChip">+ 추가</button>`);
  $("chips").querySelectorAll(".cn").forEach(b=>b.onclick=()=>{fCat=b.dataset.n;render()});
  $("chips").querySelectorAll(".cx").forEach(b=>b.onclick=()=>deleteCat(b.dataset.n));
  $("chips").querySelectorAll(".cname").forEach(inp=>{
    inp.oninput=()=>{inp.size=Math.max(3,inp.value.length+1)};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();inp.blur()}else if(e.key==="Escape"){inp.value=inp.dataset.n;inp.blur()}};
    inp.onchange=()=>renameCat(inp.dataset.n,inp.value.trim());
  });
  const ab=$("addChip");if(ab)ab.onclick=()=>{newOpen=!newOpen;render();if(newOpen)$("ncName").focus()};
  $("catEdit").textContent=catEdit?"완료":"✎ 수정";$("catEdit").classList.toggle("on",catEdit);
  $("newcat").hidden=catEdit||!newOpen;

  // calendar
  const mk=key(view).slice(0,7);
  $("ym").textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;
  $("mTitle").textContent=`${view.getMonth()+1}월 할 일`;
  $("dows").innerHTML=DOW.map(d=>`<div class="dow">${d}</div>`).join("");
  const first=view.getDay(),len=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
  let h="";for(let i=0;i<first;i++)h+=`<div class="day empty"></div>`;
  for(let d=1;d<=len;d++){
    const dt=new Date(view.getFullYear(),view.getMonth(),d),k=key(dt);
    const due=S.todos.find(t=>t.dl&&t.dl.date===k&&!t.done)||S.todos.find(t=>t.dl&&t.dl.date===k);
    let sub;
    if(due&&due.dl.label){const c=cat(due.cat);sub=`<span class="mark" style="background:${c.bg};color:${c.tx}">${esc(due.dl.label)}</span>`}
    else{const cs=[...new Set(S.todos.filter(t=>occurs(t,k)).map(t=>t.cat))].slice(0,4);
      sub=`<span class="dots">${cs.map(n=>`<i style="background:${k===key(sel)?"#fff":cat(n).dot}"></i>`).join("")}</span>`}
    h+=`<button class="day ${k===key(today)?"today":""} ${k===key(sel)?"sel":""}" data-d="${d}">${d}${sub}</button>`;
  }
  $("days").innerHTML=h;
  $("days").querySelectorAll(".day:not(.empty)").forEach(b=>b.onclick=()=>{sel=new Date(view.getFullYear(),view.getMonth(),+b.dataset.d);
    if(fDl&&!$("dDate").dataset.touched)$("dDate").value=key(sel);if(fRp)renderRp();render()});

  // deadlines
  const dls=S.todos.filter(t=>t.dl&&!t.done).sort((a,b)=>a.dl.date.localeCompare(b.dl.date));
  $("dlCount").textContent=dls.length+"개";
  $("dlList").innerHTML=dls.length?dls.map(t=>{
    const c=cat(t.cat),diff=Math.round((parse(t.dl.date)-today)/864e5),dd=parse(t.dl.date);
    const b=diff===0?"D-day":diff>0?"D-"+diff:"D+"+(-diff);
    return `<div class="dl-item"><span class="dbadge" style="background:${c.bg};color:${c.tx}">${b}</span>
    <div class="t"><b>${esc(t.text)}</b><small>${dd.getMonth()+1}/${dd.getDate()} (${DOW[dd.getDay()]})</small></div><span class="d" style="background:${c.dot}"></span></div>`}).join(""):`<div class="empty-msg">등록된 마감이 없어요</div>`;

  // day panel
  const list=S.todos.filter(t=>occurs(t,key(sel)));
  $("dTitle").textContent=`${sel.getMonth()+1}월 ${sel.getDate()}일 ${DOW[sel.getDay()]}요일`;
  $("dSub").textContent=`${list.filter(t=>isDone(t,key(sel))).length}/${list.length} 완료`;
  $("list").innerHTML=list.length?groupHTML(list.map(t=>({t,extra:t.repeat?`<span class="due rp">↻ ${esc(repeatLabel(t))}</span>`:t.dl?`<span class="due">마감 ${parse(t.dl.date).getMonth()+1}/${parse(t.dl.date).getDate()}</span>`:"",done:isDone(t,key(sel))}))):`<div class="empty-msg">이 날의 할 일이 없어요. 위의 “+ 할 일 추가”를 눌러보세요</div>`;
  bindList($("list"),"todos",()=>S.todos,render);

  // monthly
  const ml=S.monthly[mk]||(S.monthly[mk]=[]);
  $("mList").innerHTML=groupHTML(ml.map(t=>({t,extra:"",done:t.done})));
  bindList($("mList"),"monthly",()=>S.monthly[mk],render);
}

// form
function setDl(on){
  if(on&&fRp)setRp(false);
  fDl=on;$("tgNone").classList.toggle("on",!on);$("tgSet").classList.toggle("on",on);
  $("dlInputs").classList.toggle("open",on);
  if(on&&!$("dDate").value)$("dDate").value=key(sel);
}
const rpBase=()=>{const t=editId!=null&&S.todos.find(x=>x.id===editId);return t?parse(t.date):sel};
function renderRp(){
  const bd=rpBase();
  $("rpNone").classList.toggle("on",!fRp);$("rpSet").classList.toggle("on",fRp);
  $("rpOpts").classList.toggle("open",fRp);
  $("rpType").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===rpType));
  const dp=$("rpDays");dp.classList.toggle("open",fRp&&rpType==="weekly");
  dp.innerHTML=DOW.map((d,i)=>`<button data-d="${i}" class="${rpDays.has(i)?"on":""}">${d}</button>`).join("");
  dp.querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=+b.dataset.d;rpDays.has(i)?rpDays.delete(i):rpDays.add(i);renderRp()});
  $("rpHint").textContent=rpType==="daily"?`${bd.getMonth()+1}월 ${bd.getDate()}일부터 매일 반복돼요`
    :rpType==="weekly"?(rpDays.size?"선택한 요일마다 반복돼요":"반복할 요일을 선택하세요")
    :`매월 ${bd.getDate()}일에 반복돼요 (31일 → 짧은 달은 말일)`;
}
function setRp(on){
  if(on&&fDl)setDl(false);
  fRp=on;if(on&&!rpDays.size)rpDays.add(rpBase().getDay());renderRp();
}
$("rpNone").onclick=()=>setRp(false);$("rpSet").onclick=()=>setRp(true);
$("rpType").querySelectorAll("button").forEach(b=>b.onclick=()=>{rpType=b.dataset.t;renderRp()});
function resetForm(){editId=null;$("add").textContent="추가하기";$("editBanner").hidden=true;fRp=false;rpType="daily";rpDays=new Set();$("rpUntil").value="";renderRp();$("text").value="";$("dLabel").value="";$("dCnt").textContent="0/4";$("dDate").value="";delete $("dDate").dataset.touched;setDl(false)}
function openForm(o){$("form").classList.toggle("open",o);const b=$("toggleForm");b.textContent=o?"×  닫기":"+ 할 일 추가";b.classList.toggle("dark",!o);if(!o&&editId!=null)resetForm();if(o)$("text").focus()}
$("toggleForm").onclick=()=>openForm(!$("form").classList.contains("open"));
$("cancel").onclick=()=>{resetForm();openForm(false)};
$("tgNone").onclick=()=>setDl(false);$("tgSet").onclick=()=>setDl(true);
$("dDate").oninput=e=>e.target.dataset.touched=1;
$("dLabel").oninput=e=>$("dCnt").textContent=e.target.value.length+"/4";
$("mCat").onchange=render;
$("add").onclick=()=>run(async()=>{
  const text=$("text").value.trim();if(!text){$("text").focus();return}
  let dl=null;
  if(fDl){const d=$("dDate").value;if(!d){$("dDate").focus();return}dl={date:d,label:$("dLabel").value.trim()}}
  let repeat=null;
  if(fRp){
    if(rpType==="weekly"&&!rpDays.size){toast("반복할 요일을 선택하세요");return}
    const until=$("rpUntil").value||null;
    const startKey=editId!=null?(S.todos.find(x=>x.id===editId)||{date:key(sel)}).date:key(sel);
    if(until&&until<startKey){toast("종료일은 시작일 이후여야 해요");return}
    repeat={type:rpType,days:rpType==="weekly"?[...rpDays].sort():[],until};
  }
  if(editId!=null){
    const upd=await api("PATCH",`/api/todos/${editId}`,{text,cat:fCat,dl,repeat});
    const i=S.todos.findIndex(x=>x.id===editId);if(i>=0)S.todos[i]=upd;
    resetForm();openForm(false);render();toast("수정했어요");return;
  }
  const t=await api("POST","/api/todos",{date:key(sel),text,cat:fCat,dl,repeat});
  S.todos.push(t);resetForm();render();
});
$("text").onkeydown=e=>{if(e.key==="Enter")$("add").click()};
function startEdit(t){
  editId=t.id;fCat=t.cat;fDl=false;fRp=false;
  openForm(true);
  $("text").value=t.text;
  if(t.dl){setDl(true);$("dDate").value=t.dl.date;$("dDate").dataset.touched=1;$("dLabel").value=t.dl.label||"";$("dCnt").textContent=$("dLabel").value.length+"/4"}
  else{setDl(false);$("dDate").value="";$("dLabel").value="";$("dCnt").textContent="0/4";delete $("dDate").dataset.touched}
  if(t.repeat){rpType=t.repeat.type;rpDays=new Set(t.repeat.days||[]);$("rpUntil").value=t.repeat.until||"";setRp(true)}
  else{rpType="daily";rpDays=new Set();$("rpUntil").value="";setRp(false)}
  $("add").textContent="저장하기";
  $("editBanner").hidden=false;$("editBanner").textContent="✎ 할 일 수정 중 — 변경 후 ‘저장하기’를 누르세요";
  render();
  $("form").scrollIntoView({behavior:"smooth",block:"center"});$("text").focus();
}
function startMonthlyEdit(t){
  mEditId=t.id;$("mText").value=t.text;$("mCat").value=t.cat;
  $("mAdd").textContent="저장";$("mCancel").hidden=false;render();$("mText").focus();
}
function endMonthlyEdit(){mEditId=null;$("mText").value="";$("mAdd").textContent="추가";$("mCancel").hidden=true}
$("mCancel").onclick=()=>{endMonthlyEdit();render()};
async function renameCat(old,n){
  if(!n||n===old){render();return}
  if(S.cats.some(c=>c.n===n)){toast("이미 있는 카테고리예요");render();return}
  await run(async()=>{await api("PATCH",`/api/categories/${encodeURIComponent(old)}`,{name:n});if(fCat===old)fCat=n;await reload()});
}
$("catEdit").onclick=()=>{catEdit=!catEdit;if(catEdit)newOpen=false;render()};
async function deleteCat(n){
  if(S.cats.length<=1){toast("카테고리는 최소 1개 있어야 해요");return}
  const cnt=S.todos.filter(t=>t.cat===n).length+Object.values(S.monthly).flat().filter(t=>t.cat===n).length;
  if(!confirm(cnt?`"${n}" 카테고리와 그 안의 할 일 ${cnt}개가 함께 삭제돼요. 삭제할까요?`:`"${n}" 카테고리를 삭제할까요?`))return;
  await run(async()=>{await api("DELETE",`/api/categories/${encodeURIComponent(n)}${cnt?"?cascade=1":""}`);await reload()});
}
$("ncColor").oninput=e=>$("ncSwatch").style.background=e.target.value;
$("ncName").oninput=e=>$("ncAdd").disabled=!e.target.value.trim();
$("ncName").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();$("ncAdd").click()}else if(e.key==="Escape"){newOpen=false;render()}};
$("ncAdd").onclick=()=>run(async()=>{const n=$("ncName").value.trim();if(!n)return;
  if(S.cats.some(c=>c.n===n)){toast("이미 있는 카테고리예요");return}
  const c=await api("POST","/api/categories",{name:n,...(({dot,bg,tx})=>({dot,bg,tx}))(mkCat(n,$("ncColor").value))});
  S.cats.push(c);fCat=c.n;$("ncName").value="";$("ncAdd").disabled=true;newOpen=false;$("ncColor").value="#1b1d21";$("ncSwatch").style.background="#1b1d21";render()});
$("mAdd").onclick=()=>run(async()=>{const t=$("mText").value.trim();if(!t)return;
  if(mEditId!=null){
    const upd=await api("PATCH",`/api/monthly/${mEditId}`,{text:t,cat:$("mCat").value});
    for(const k of Object.keys(S.monthly)){const i=S.monthly[k].findIndex(x=>x.id===mEditId);if(i>=0){S.monthly[k][i]=upd;break}}
    endMonthlyEdit();render();toast("수정했어요");return;
  }
  const mk=key(view).slice(0,7);
  const m=await api("POST","/api/monthly",{month:mk,text:t,cat:$("mCat").value});
  (S.monthly[mk]=S.monthly[mk]||[]).push(m);$("mText").value="";render()});
$("mText").onkeydown=e=>{if(e.key==="Enter")$("mAdd").click()};
$("prev").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};
$("next").onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};
reload().catch(e=>toast("서버에 연결할 수 없어요"));
</script>
</body>
</html>
